name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: mkdir -p www && cp app.html www/index.html
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: npm install
      - run: npx cap add android
      - name: Micro (RECORD_AUDIO)
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' android/app/src/main/AndroidManifest.xml
          grep RECORD_AUDIO android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's#(<category android:name="android.intent.category.LAUNCHER" />\s*</intent-filter>)#$1\n            <intent-filter><action android:name="android.intent.action.SEND" /><category android:name="android.intent.category.DEFAULT" /><data android:mimeType="text/*" /></intent-filter>\n            <intent-filter><action android:name="android.intent.action.SEND" /><category android:name="android.intent.category.DEFAULT" /><data android:mimeType="application/*" /></intent-filter>\n            <intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><data android:scheme="content" /><data android:mimeType="text/*" /></intent-filter>\n            <intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><data android:scheme="content" /><data android:mimeType="application/octet-stream" /></intent-filter>#' android/app/src/main/AndroidManifest.xml
          grep -c "intent.action.SEND" android/app/src/main/AndroidManifest.xml
          F=$(find android/app/src/main/java -name MainActivity.java)
          cat > "$F" <<'JAVA'
          package com.pianotools.fretboardforge;
          import android.os.Bundle;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.webkit.PermissionRequest;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Handler;
          import android.os.Looper;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 1);
              bridge.getWebView().setWebChromeClient(new BridgeWebChromeClient(bridge) {
                @Override public void onPermissionRequest(final PermissionRequest r) { runOnUiThread(() -> r.grant(r.getResources())); }
              });
              handleShare(getIntent(), 2500);
            }
            @Override protected void onNewIntent(Intent i) { super.onNewIntent(i); setIntent(i); handleShare(i, 300); }
            private void handleShare(Intent i, int delay) {
              if (i == null) return;
              String a = i.getAction(); String txt = null;
              try {
                if (Intent.ACTION_SEND.equals(a)) {
                  txt = i.getStringExtra(Intent.EXTRA_TEXT);
                  Uri u = i.getParcelableExtra(Intent.EXTRA_STREAM);
                  if (u != null) txt = readUri(u);
                } else if (Intent.ACTION_VIEW.equals(a) && i.getData() != null) {
                  txt = readUri(i.getData());
                }
              } catch (Exception e) { txt = null; }
              if (txt == null || txt.isEmpty()) return;
              final String js = "window.__ffShared=" + JSONObject.quote(txt) + ";if(window.ffImport)ffImport(window.__ffShared);";
              new Handler(Looper.getMainLooper()).postDelayed(() -> bridge.getWebView().evaluateJavascript(js, null), delay);
            }
            private String readUri(Uri u) throws Exception {
              InputStream in = getContentResolver().openInputStream(u);
              BufferedReader br = new BufferedReader(new InputStreamReader(in, "UTF-8"));
              StringBuilder sb = new StringBuilder(); String line; int n = 0;
              while ((line = br.readLine()) != null && n < 20000) { sb.append(line).append('\n'); n++; }
              br.close(); return sb.toString();
            }
          }
          JAVA
          sed -i 's/^          //' "$F"
      - run: npx cap sync android
      - name: Numero de version croissant
        run: |
          V=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk fretboard-forge.apk
      - name: Signature fixe (cle du depot, identique a chaque version)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey fretboard-forge.apk
          $BT/apksigner verify --print-certs fretboard-forge.apk | head -3
      - uses: actions/upload-artifact@v4
        with: {name: fretboard-forge.apk, path: fretboard-forge.apk}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fretboard Forge build ${{ github.run_number }}
          files: fretboard-forge.apk

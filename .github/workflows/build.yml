name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: mkdir -p www && cp app.html www/index.html
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: npm install
      - run: npx cap add android
      - name: Micro (RECORD_AUDIO)
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' android/app/src/main/AndroidManifest.xml
          grep RECORD_AUDIO android/app/src/main/AndroidManifest.xml
          F=$(find android/app/src/main/java -name MainActivity.java)
          cat > "$F" <<'JAVA'
          package com.pianotools.fretboardforge;
          import android.os.Bundle;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.webkit.PermissionRequest;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 1);
              bridge.getWebView().setWebChromeClient(new BridgeWebChromeClient(bridge) {
                @Override public void onPermissionRequest(final PermissionRequest r) { runOnUiThread(() -> r.grant(r.getResources())); }
              });
            }
          }
          JAVA
          sed -i 's/^          //' "$F"
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk fretboard-forge.apk
      - uses: actions/upload-artifact@v4
        with: {name: fretboard-forge.apk, path: fretboard-forge.apk}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fretboard Forge build ${{ github.run_number }}
          files: fretboard-forge.apk
